name = "chain-siren"
listen = "127.0.0.1:8080"
database_env = "DATABASE_URL"
data_dir = "data"
mode = "observe"
journal_max_bytes = 268435456
max_input_bytes = 16777216
rpc_concurrency = 16
trace_candidates_per_block = 8
poll_ms = 1000
shutdown_seconds = 30
max_reorg_depth = 128
api_requests_per_minute = 120
known_bad_hashes = []
shared_accounts = []

[funding]
recent_seconds = 86400
max_pre_nonce = 3
watch_seconds = 604800
max_hops = 2
max_fanout = 16
minimum_native = "0x2386f26fc10000"
max_profiles = 100000

